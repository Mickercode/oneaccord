name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main, staging, production]

# A newer push to the same branch makes an older run pointless, except on the
# deploy branches, where we want the full record of what was built.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  check:
    name: Format, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneaccord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oneaccord
      REDIS_URL: redis://localhost:6379
      # Only ever signs tokens inside this job. The real one lives in Railway.
      APP_SECRET: ci-secret-not-used-anywhere-real
      API_URL: http://127.0.0.1:3000/api
      WEB_URL: http://localhost:5173
      TEAM_URL: http://localhost:5174
      ADMIN_URL: http://localhost:5175
      MAIL_PROVIDER: console
      API_LOG: ${{ github.workspace }}/api.log

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Migrate and seed
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Start the API
        run: |
          node apps/api/dist/main.js > "$API_LOG" 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 1
          done
          echo "The API never came up."
          cat "$API_LOG"
          exit 1

      - name: Walk the whole flow
        run: bash scripts/e2e.sh

      - name: The API log, when something went wrong
        if: failure()
        run: tail -200 "$API_LOG"

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests prove the image builds; only the real branches publish.
      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
