name: Deploy

# The one deploy job. deploy-staging.yml and deploy-production.yml both call
# it, so the two environments can never drift apart by accident.
#
# Render is asked to deploy with a deploy hook rather than watching the branch
# itself. That matters for two reasons: nothing deploys until CI is green, and
# a merge into `production` still waits on the approval set on the GitHub
# environment. Render's own auto-deploy would bypass both, so turn it off on
# the service ("Auto-Deploy: No") and let this drive.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy into.
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Secrets, the URL and any required reviewers all hang off this.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_BASE_URL }}

    # Never let two deploys of the same environment overlap, and never cancel
    # one half-way: a cancelled deploy can leave migrations half-applied.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Check the environment is wired up
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::No RENDER_DEPLOY_HOOK on the '${{ inputs.environment }}' environment."
            echo "Render service -> Settings -> Deploy Hook, then add it under"
            echo "GitHub Settings -> Environments -> ${{ inputs.environment }}."
            echo "See CONTRIBUTING.md, 'Wiring up a Render environment'."
            exit 1
          fi
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "::error::No API_BASE_URL variable on the '${{ inputs.environment }}' environment."
            echo "Set it to the service's address so the deploy can be checked."
            exit 1
          fi

      - name: Ask Render to deploy this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # The hook takes the ref to build, so the deploy is this exact commit
          # rather than whatever the branch happens to point at by the time
          # Render gets round to it.
          response=$(curl -fsS -X POST "$HOOK&ref=${{ github.sha }}")
          echo "Render accepted the deploy: $response"

      # Asking for a deploy is not the same as getting one. Wait until the
      # service reports this commit as the one it is actually serving.
      - name: Wait for this commit to be serving
        run: |
          want='${{ github.sha }}'
          for i in $(seq 1 60); do
            body=$(curl -fsS "${{ vars.API_BASE_URL }}/health" 2>/dev/null || true)
            running=$(printf '%s' "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            healthy=$(printf '%s' "$body" | grep -c '"ok":true' || true)

            if [ "$running" = "$want" ] && [ "$healthy" = "1" ]; then
              echo "Serving ${running:0:7} and healthy."
              echo "$body"
              exit 0
            fi

            echo "($i/60) serving ${running:-nothing yet}, waiting for ${want:0:7}"
            sleep 20
          done
          echo "::error::${{ inputs.environment }} never came up on ${want:0:7}."
          echo "The Render dashboard will say why: a failed build, or a container"
          echo "that cannot reach its database and is restarting."
          exit 1

      - name: Say where it went
        run: |
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: ${{ vars.API_BASE_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
