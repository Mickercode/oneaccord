name: Promote

# Works out what a promotion would carry and hands back a one-click link to
# open the pull request. It deliberately does not open the PR itself: that
# needs "Allow GitHub Actions to create and approve pull requests" on the
# whole repository, which is a lot of rope for a convenience.
on:
  workflow_dispatch:
    inputs:
      to:
        description: Which branch to promote into.
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what is going out
        env:
          TO: ${{ inputs.to }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          FROM=main
          if [ "$TO" = "production" ]; then FROM=staging; fi

          if git diff --quiet "origin/$TO" "origin/$FROM"; then
            echo "::notice::$TO already matches $FROM. Nothing to promote."
            {
              echo "### Nothing to promote"
              echo
              echo "\`$TO\` already matches \`$FROM\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(git rev-list --count --no-merges "origin/$TO..origin/$FROM")
          url="$SERVER/$REPO/compare/$TO...$FROM?expand=1&title=Promote+$FROM+to+$TO"

          {
            echo "### Promote \`$FROM\` into \`$TO\`"
            echo
            echo "**[Open the promotion pull request]($url)**"
            echo
            echo "$count commit(s) would go out:"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "origin/$TO..origin/$FROM"
            echo
            echo "Merging that pull request is what deploys."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::$count commit(s) ready to promote. The run summary has the link."
