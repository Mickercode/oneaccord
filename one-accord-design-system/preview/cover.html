<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Archivo:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: var(--ground);
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--ground);
      }
      .cover svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      .fire {
        fill: var(--fire);
      }
      .ink {
        fill: var(--ink);
      }
      .gold {
        fill: var(--gold);
      }
      .stripe {
        fill: var(--on-gold);
      }
      .text {
        position: absolute;
        left: 40px;
        bottom: 36px;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .name {
        margin: 0;
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 800;
        font-size: 104px;
        line-height: 0.95;
        text-transform: uppercase;
        color: var(--ink);
      }
      .tagline {
        margin: 0;
        font-family: var(--font-body);
        font-size: 14px;
        line-height: 20px;
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
        <!--
      blocks: fire slab 160x288 (4 x space-5), ink block 280x150, gold band 280x56 (2 x space-4 + space-2)
      arrangement: one tall red slab bleeding top and bottom, a black block bleeding top-right, a gold tab beneath it
      pattern: stripes row, because the README names the Lagos city tab's black diagonal stripes as a signature pattern
      steps and radii: space-4 (24) stripe pitch with space-3 (16) stripes; corners square, as radius-sm keeps the brand sharp
    -->
        <defs>
          <clipPath id="band"><rect x="680" y="150" width="280" height="56" /></clipPath>
        </defs>
        <rect class="fire" x="520" y="0" width="160" height="288" />
        <rect class="ink" x="680" y="0" width="280" height="150" />
        <rect class="gold" x="680" y="150" width="280" height="56" />
        <g clip-path="url(#band)">
          <polygon class="stripe" points="696,150 712,150 684,206 668,206" />
          <polygon class="stripe" points="736,150 752,150 724,206 708,206" />
          <polygon class="stripe" points="776,150 792,150 764,206 748,206" />
          <polygon class="stripe" points="816,150 832,150 804,206 788,206" />
          <polygon class="stripe" points="856,150 872,150 844,206 828,206" />
          <polygon class="stripe" points="896,150 912,150 884,206 868,206" />
          <polygon class="stripe" points="936,150 952,150 924,206 908,206" />
          <polygon class="stripe" points="976,150 992,150 964,206 948,206" />
        </g>
      </svg>
      <div class="text">
        <p class="name">One<br />Accord</p>
        <p class="tagline">
          All with one accord, in one place. Registration and check-in for Upper Room.
        </p>
      </div>
    </div>
    <script></script>
  </body>
</html>
