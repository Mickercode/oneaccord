# Postgres for local work. Production uses a managed one.
# There is no Redis: the mail queue lives in Postgres and Socket.IO uses
# LISTEN/NOTIFY to reach clients on other instances.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oneaccord
    ports:
      # 55433 on the host, so One Accord never collides with another
      # project's Postgres on the usual 5432.
      - '55433:5432'
    volumes:
      - oneaccord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oneaccord-postgres:
